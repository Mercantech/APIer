# Gateway foran backends. Kun gateway har Traefik-labels.
# Unikke service-navne på dokploy-network (ingen ekstra bridge).
services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - apier-web
      - opgaver-api
      - go-api
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.apier-gateway.rule=Host(`api-opgaver.mercantec.tech`)
      - traefik.http.routers.apier-gateway.entrypoints=web
      - traefik.http.routers.apier-gateway.service=apier-gateway
      - traefik.http.services.apier-gateway.loadbalancer.server.port=80

  # Unikt navn — "web" kolliderer med andre stacks på dokploy-network
  apier-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped

  go-api:
    build:
      context: ./go
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      opgaver-db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-opgaver}:${POSTGRES_PASSWORD}@opgaver-db:5432/${POSTGRES_DB:-opgaver}?sslmode=disable
      SEED_API_KEY: ${SEED_API_KEY:?SEED_API_KEY required}
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-1.20.4}

  opgaver-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opgaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-opgaver}
    volumes:
      - opgaver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opgaver} -d ${POSTGRES_DB:-opgaver}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opgaver-mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-opgaver}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD required}
    volumes:
      - opgaver_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # S3-kompatibel object storage (unikt navn på dokploy-network)
  opgaver-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apier}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-apier-minio-dev-only}
    volumes:
      - opgaver_minio_data:/data

  opgaver-minio-init:
    image: minio/mc:latest
    depends_on:
      - opgaver-minio
    restart: "on-failure"
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'Waiting for MinIO…';
      until mc alias set local http://opgaver-minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-apier-assets};
      mc anonymous set download local/$${S3_BUCKET:-apier-assets};
      echo 'Bucket klar';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apier}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-apier-minio-dev-only}
      S3_BUCKET: ${S3_BUCKET:-apier-assets}

  opgaver-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      opgaver-db:
        condition: service_healthy
      opgaver-mongo:
        condition: service_started
      opgaver-minio:
        condition: service_started
      opgaver-minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:5104
      ConnectionStrings__DefaultConnection: Host=opgaver-db;Port=5432;Database=${POSTGRES_DB:-opgaver};Username=${POSTGRES_USER:-opgaver};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__MongoDB: mongodb://${MONGO_USER:-opgaver}:${MONGO_PASSWORD}@opgaver-mongo:27017/?authSource=admin
      MongoDB__Database: ${MONGO_DATABASE:-opgaverapi}
      Seed__ApiKey: ${SEED_API_KEY:?SEED_API_KEY required}
      Jwt__Issuer: ${JWT_ISSUER:-opgaver-api}
      Jwt__Audience: ${JWT_AUDIENCE:-opgaver-api}
      Jwt__Key: ${JWT_KEY:?JWT_KEY required}
      Auth__Issuer: ${AUTH_ISSUER:-https://auth.mercantec.tech}
      Auth__Audience: ${AUTH_AUDIENCE:-mercantec-apps}
      Auth__JwksUri: ${JWKS_URI:-https://auth.mercantec.tech/.well-known/jwks.json}
      S3__ServiceUrl: ${S3_SERVICE_URL:-http://opgaver-minio:9000}
      S3__AccessKey: ${MINIO_ROOT_USER:-apier}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-apier-minio-dev-only}
      S3__Bucket: ${S3_BUCKET:-apier-assets}
      S3__PublicBasePath: ${S3_PUBLIC_BASE_PATH:-/assets}
      S3__SyncChampionsOnStartup: ${S3_SYNC_CHAMPIONS_ON_STARTUP:-true}

networks:
  default:
    name: dokploy-network
    external: true

volumes:
  opgaver_pgdata:
  opgaver_mongodata:
  opgaver_minio_data:
