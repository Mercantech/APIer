# Lokal: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Gateway: http://localhost:8080  |  Go: /go/  |  .NET: /swagger
services:
  gateway:
    ports:
      - "8080:80"

  web:
    ports:
      - "3000:80"

  go-api:
    ports:
      - "8081:8080"

  opgaver-db:
    ports:
      - "5433:5432"

  opgaver-mongo:
    ports:
      - "27018:27017"

  opgaver-api:
    ports:
      - "5104:5104"

networks:
  default:
    name: apier-local-net
    external: false
