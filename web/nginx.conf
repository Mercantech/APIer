server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /auth/callback {
        try_files /auth/callback.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
