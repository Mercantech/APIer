server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Undgå stale CSS/JS bag Cloudflare / browser-cache
    add_header Cache-Control "no-cache, must-revalidate" always;

    location = /auth/callback {
        try_files /auth/callback.html =404;
    }

    # /demo/{api} → /demo/{api}/index.html
    location = /demo/pokemon {
        return 301 /demo/pokemon/;
    }
    location = /demo/minecraft {
        return 301 /demo/minecraft/;
    }
    location /demo/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # /teori/{lesson}/ → static HTML (ikke SPA-fallback til kataloget)
    location /teori/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
